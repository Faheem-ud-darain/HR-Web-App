<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="4;url=/auth">
<title>Resetting the portal</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0b0f1a; color: #e8ecf5; font-family: system-ui, sans-serif; text-align: center; }
  main { max-width: 26rem; padding: 1.5rem; }
  h1 { font-size: 1.25rem; margin: 0 0 .75rem; }
  p { line-height: 1.5; margin: .5rem 0; color: #b9c2d6; }
  a { display: inline-block; margin-top: 1rem; padding: .6rem 1.4rem; border-radius: 9999px; border: 1px solid #ffc93c; color: #ffe08a; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Resetting the portal on this browser</h1>
  <p>The saved data for this site is being cleared. You will be signed out; sign in again on the next page.</p>
  <p>If you are in the middle of a shift, the shift is not affected.</p>
  <a href="/auth">Continue to sign in</a>
</main>
</body>
</html>
