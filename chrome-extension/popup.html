<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Delcargo HR Tracker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="logo-icon">DC</div>
        <div class="title-group">
          <h1>Delcargo HR</h1>
          <span class="subtitle">Chromebook Tracker</span>
        </div>
      </div>
      <div id="statusPill" class="status-pill status-offline">
        <span class="dot"></span>
        <span id="statusText">Disconnected</span>
      </div>
    </header>

    <!-- SETUP SCREEN (When not connected with a Personal Code) -->
    <div id="setupView" class="view-section">
      <div class="main-card">
        <div class="setup-header">
          <h2>Connect Tracker</h2>
          <p>Paste the Personal Setup Code generated for you on the HR Portal (Tracker Setup screen).</p>
        </div>

        <div class="inputs-form">
          <div class="form-group">
            <label for="setupCodeInput">Personal Setup Code</label>
            <textarea id="setupCodeInput" rows="3" placeholder="Paste your setup code here..." required></textarea>
          </div>
          <div id="setupError" class="error-msg" style="display: none;"></div>
        </div>

        <button id="connectCodeBtn" class="btn btn-primary">
          <span>Connect Device</span>
        </button>
      </div>
    </div>

    <!-- MAIN TRACKER SCREEN (When connected) -->
    <div id="mainView" class="view-section" style="display: none;">
      <div class="main-card">
        <div class="user-badge">
          <span class="user-label">Employee</span>
          <span id="displayEmail" class="user-email">employee@delcargo.us</span>
        </div>

        <!-- Active Shift Timer Display -->
        <div class="timer-section">
          <div class="timer-label">Shift Duration</div>
          <div id="timerDisplay" class="timer-digits">00:00:00</div>
        </div>

        <!-- Action Button -->
        <button id="toggleShiftBtn" class="btn btn-primary">
          <span id="btnIcon">▶</span>
          <span id="btnText">Start Shift</span>
        </button>

        <button id="disconnectBtn" class="btn-text">
          Change Setup Code / Disconnect
        </button>
      </div>
    </div>

    <!-- Footer Stats / Indicators -->
    <footer class="app-footer">
      <div class="indicator">
        <span class="indicator-dot dot-active"></span>
        <span>37m continuous idle auto-stop</span>
      </div>
      <div class="version">v1.0.0</div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
