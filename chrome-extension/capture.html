<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Delcargo HR — Desktop Monitor Tracker</title>
  <style>
    body {
      background-color: #0b0f1a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background-color: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 32px;
      max-width: 460px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      margin: 0 0 8px 0;
      color: #ffffff;
    }
    p {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.5;
      margin: 0 0 24px 0;
    }
    .btn {
      background-color: #ea580c;
      color: #ffffff;
      font-weight: 800;
      font-size: 14px;
      padding: 14px 24px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 14px rgba(234, 88, 12, 0.4);
      transition: all 0.2s;
    }
    .btn:hover {
      background-color: #c2410c;
    }
    .active-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
      font-size: 13px;
      font-weight: 800;
      padding: 10px 16px;
      border-radius: 12px;
      margin-top: 16px;
    }
    .subtext {
      margin-top: 12px;
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🖥️</div>
    <h1>Full Desktop Screen Tracker</h1>
    <p id="instructionText">Select <strong>Entire Screen</strong> when prompted to enable activity tracking across all desktop applications and windows.</p>
    
    <button id="startBtn" class="btn">Select Entire Screen</button>

    <div id="activeBadge" class="active-badge" style="display: none;">
      <span>🟢</span>
      <span id="resText">Full Desktop Monitor Tracking Active</span>
    </div>
    
    <div id="subtext" class="subtext" style="display: none;">
      You may minimize or keep this tab in the background while working.
    </div>
  </div>

  <video id="screenVideo" autoplay muted playsinline style="display:none;"></video>
  <canvas id="screenCanvas" style="display:none;"></canvas>

  <script src="capture.js"></script>
</body>
</html>
